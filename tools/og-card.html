<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Arşiv Ara paylaşım kartı</title>
<!-- tools/make_og_image.ps1 bu sayfayı 1200x630 çizip docs/images/og.png yapar (sosyal medya önizlemesi). -->
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  position: relative;
  background: radial-gradient(circle at 16% 18%, #14365A 0%, #08121F 58%);
  color: #E9F1F8;
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
}
.left { position: absolute; left: 72px; top: 78px; width: 540px; }
.brand { display: flex; align-items: center; gap: 20px; }
.brand img { width: 96px; height: 96px; }
.brand h1 { margin: 0; font-size: 62px; font-weight: 700; letter-spacing: -0.01em; }
.tag { margin: 44px 0 0; font-size: 44px; line-height: 1.18; font-weight: 600; }
.tag em { font-style: normal; color: #4DB4F2; }
.formats { margin: 30px 0 0; font: 600 22px/1 "Cascadia Mono", Consolas, monospace; letter-spacing: 0.05em; color: #9AACBE; }
.foot { position: absolute; left: 72px; bottom: 50px; margin: 0; font-size: 22px; color: #9AACBE; }
.foot strong { color: #E9F1F8; font-weight: 600; }
.shot {
  position: absolute; left: 650px; top: 112px; width: 640px;
  border-radius: 14px; border: 1px solid #1E3047; box-shadow: 0 30px 80px rgb(0 0 0 / 0.6);
}
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: linear-gradient(90deg, #0F6BBF, #F7861F); }
</style>
</head>
<body>
<div class="left">
  <div class="brand"><img src="../docs/images/logo-arsiv.svg" alt=""><h1>Arşiv Ara</h1></div>
  <p class="tag">Arşivleri <em>açmadan</em><br>içinde ara.</p>
  <p class="formats">ZIP · RAR · 7z · TAR · ISO</p>
</div>
<p class="foot">Verlora Studios · Created By <strong>MaledictusMaggot®</strong> · MIT</p>
<img class="shot" src="../docs/images/search.png" alt="">
<div class="bar"></div>
</body>
</html>
