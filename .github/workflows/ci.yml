# Builds and runs the unit tests and the UI smoke test on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build ArsivAra.sln -c Release

      - name: Unit tests
        run: dotnet test tests/ArsivAra.Core.Tests -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results

      # Starts the app and drives it through UI Automation. A desktop session is not always ready on hosted
      # runners, so this step does not fail the build; its screenshots are attached as an artifact.
      - name: UI smoke test
        shell: pwsh
        continue-on-error: true
        run: ./tests/ui/ui-smoke.ps1 -Screenshots ui-screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results
            ui-screenshots
          if-no-files-found: ignore
