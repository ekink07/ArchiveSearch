# When a tag such as v1.2.3 is pushed: runs the tests, builds portable exes for x64 and ARM64,
# signs them if the secrets are set, publishes a GitHub release and submits the winget update.
#   git tag v1.1.0
#   git push origin v1.1.0
#
# Optional secrets (Settings > Secrets and variables > Actions); a step is skipped when its secrets are missing.
# Details: packaging/README.md
#   Signing with SSL.com eSigner (cloud OV certificate, available from Turkey):
#     ES_USERNAME, ES_PASSWORD, ES_CREDENTIAL_ID, ES_TOTP_SECRET
#   Signing with Azure Artifact Signing (formerly Trusted Signing; only organizations in supported countries):
#     AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#     TRUSTED_SIGNING_ENDPOINT, TRUSTED_SIGNING_ACCOUNT, TRUSTED_SIGNING_PROFILE
#   winget (after the package has been added to winget-pkgs once by hand):
#     WINGET_TOKEN  (classic GitHub token with public_repo; microsoft/winget-pkgs must be forked under the same account)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Unit tests
        run: dotnet test tests/ArsivAra.Core.Tests -c Release

  build:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            asset: ArsivAra.exe
          - rid: win-arm64
            asset: ArsivAra-arm64.exe
    env:
      AZURE_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build portable exe (${{ matrix.rid }})
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/ArsivAra.App -c Release -r ${{ matrix.rid }} --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none `
            -p:Version=$version -o out
          New-Item -ItemType Directory dist | Out-Null
          Move-Item out/ArsivAra.exe dist/${{ matrix.asset }}

      - name: Sign (Azure Artifact Signing)
        if: env.AZURE_SIGNING == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.rid }}
          path: dist/*

  sign:
    needs: build
    runs-on: ubuntu-latest
    env:
      SSLCOM_SIGNING: ${{ secrets.ES_USERNAME != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: exe-*
          path: dist
          merge-multiple: true

      - name: Sign x64 (SSL.com eSigner)
        if: env.SSLCOM_SIGNING == 'true'
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/dist/ArsivAra.exe
          override: true

      - name: Sign ARM64 (SSL.com eSigner)
        if: env.SSLCOM_SIGNING == 'true'
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/dist/ArsivAra-arm64.exe
          override: true

      # Hashes are taken after signing: install.ps1 and winget verify them.
      - name: SHA256
        run: |
          cd dist
          for f in *.exe; do
            hash=$(sha256sum "$f" | cut -d' ' -f1 | tr 'a-f' 'A-F')
            echo "$hash  $f" > "$f.sha256"
            echo "$f: \`$hash\`" >> "$GITHUB_STEP_SUMMARY"
          done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*

  release:
    needs: sign
    runs-on: windows-latest
    env:
      WINGET: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Submit the winget update
        if: env.WINGET == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: VerloraStudios.ArsivAra
          installers-regex: '\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
